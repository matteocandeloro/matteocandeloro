name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy web/ to Hetzner
        env:
          KEY:  "${{ secrets.SSH_PRIVATE_KEY }}${{ secrets.SSH_KEY }}${{ secrets.HETZNER_SSH_KEY }}${{ secrets.DEPLOY_KEY }}${{ secrets.SERVER_SSH_KEY }}"
          HOST: "${{ secrets.SSH_HOST }}${{ secrets.HETZNER_HOST }}${{ secrets.SERVER_HOST }}${{ secrets.HOST }}${{ secrets.SERVER_IP }}${{ secrets.HETZNER_IP }}"
          USER: "${{ secrets.SSH_USER }}${{ secrets.HETZNER_USER }}${{ secrets.SERVER_USER }}${{ secrets.DEPLOY_USER }}${{ secrets.REMOTE_USER }}"
          PORT: "${{ secrets.SSH_PORT }}${{ secrets.SERVER_PORT }}${{ secrets.PORT }}"
          DEST: "${{ secrets.DEPLOY_PATH }}${{ secrets.SERVER_PATH }}${{ secrets.REMOTE_PATH }}"
        run: |
          PORT="${PORT:-22}"
          DEST="${DEST:-/var/www/html/radiobt}"

          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "ERROR: secret mancante."
            echo "Chiave vuota: $([ -z "$KEY" ] && echo 'SI' || echo 'no')"
            echo "Host vuoto:   $([ -z "$HOST" ] && echo 'SI' || echo 'no')"
            echo "User vuoto:   $([ -z "$USER" ] && echo 'SI' || echo 'no')"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_rsa -p "$PORT" "$USER@$HOST" "mkdir -p $DEST"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -p $PORT -o StrictHostKeyChecking=no" \
            web/ "$USER@$HOST:$DEST/"

          echo "✓ Deployed to $USER@$HOST:$DEST"

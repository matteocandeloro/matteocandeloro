name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy web/ to Hetzner via rsync
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST:    ${{ secrets.SSH_HOST }}
          USER:    ${{ secrets.SSH_USER }}
          PORT:    ${{ secrets.SSH_PORT || '22' }}
          DEST:    ${{ secrets.DEPLOY_PATH || '/var/www/html/radiobt' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_rsa -p "$PORT" "$USER@$HOST" "mkdir -p $DEST"
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa -p $PORT" \
            web/ "$USER@$HOST:$DEST/"
          echo "Deployed to http://$HOST"

name: Build APK & Deploy Web

on:
  push:
    branches:
      - main
      - claude/android-radio-bluetooth-app-cqr68
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: RadioBT
        run: gradle assembleDebug --no-daemon

      - name: Copy APK into web folder
        run: |
          cp RadioBT/app/build/outputs/apk/debug/app-debug.apk web/RadioBT.apk
          echo "APK size: $(du -sh web/RadioBT.apk | cut -f1)"

      # Abilita GitHub Pages via API usando il GITHUB_TOKEN del workflow
      # (idempotente: se Pages è già attivo non fa nulla)
      - name: Enable GitHub Pages (auto-configure)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}')
          echo "Pages API status: $STATUS (409 = already enabled, ok)"

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          commit_message: "deploy: update RadioBT web + APK"

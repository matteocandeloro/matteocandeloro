name: Build APK & Deploy Web

on:
  push:
    branches:
      - main
      - claude/android-radio-bluetooth-app-cqr68
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: RadioBT
        run: gradle assembleDebug --no-daemon

      - name: Copy APK into web folder
        run: |
          cp RadioBT/app/build/outputs/apk/debug/app-debug.apk web/RadioBT.apk
          echo "APK size: $(du -sh web/RadioBT.apk | cut -f1)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
